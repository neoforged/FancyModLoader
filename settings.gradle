import org.gradle.api.initialization.resolve.RepositoriesMode
import org.gradle.api.initialization.resolve.RulesMode

pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }

    plugins {
        id 'net.neoforged.moddev' version '2.0.147'
        id 'net.neoforged.moddev.repositories' version '2.0.147'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'net.neoforged.moddev.repositories'
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    rulesMode = RulesMode.FAIL_ON_PROJECT_RULES
    repositories {
        mavenCentral()
        maven {
            name = "Maven for PR #3403" // https://github.com/neoforged/NeoForge/pull/3403
            url = uri("https://prmaven.neoforged.net/NeoForge/pr3403")
            content {
                includeModule("net.neoforged", "neoforge")
                includeModule("net.neoforged", "testframework")
            }
        }
    }
}

rootProject.name = 'FancyModLoader'

include 'loader'
include 'earlydisplay'
include 'junit-fml'
include 'testlib'
include 'tests'
enableFeaturePreview "STABLE_CONFIGURATION_CACHE"
